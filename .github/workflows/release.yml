# Pushing a tag like v0.1.0 builds the single-file exe and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/YoutubeMusicNative -c Release -o publish

      - uses: softprops/action-gh-release@v2
        with:
          files: publish/YoutubeMusicNative.exe
          generate_release_notes: true
